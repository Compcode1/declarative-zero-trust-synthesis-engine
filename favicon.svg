<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Dark Slate Rounded Shield Base -->
  <rect width="114" height="114" x="3" y="3" fill="#090d16" rx="22" stroke="#1e293b" stroke-width="3" />
  
  <!-- Gate 1: Metallic Steel Bevel (Boundary) -->
  <polygon points="24,18 60,36 60,48 24,30" fill="#94a3b8" />
  <polygon points="96,18 60,36 60,48 96,30" fill="#475569" />
  
  <!-- Gate 2: Rich Mid-Cobalt Bevel (Identity) -->
  <polygon points="24,39 60,57 60,69 24,51" fill="#2563eb" />
  <polygon points="96,39 60,57 60,69 96,51" fill="#1e3a8a" />
  
  <!-- Gate 3: Bright Electric Cobalt Bevel (Federation) -->
  <polygon points="24,60 60,78 60,90 24,72" fill="#60a5fa" />
  <polygon points="96,60 60,78 60,90 96,72" fill="#2563eb" />
  
  <!-- Gate 4: Vivid Adversarial Crimson Bevel (Access Lockdown) -->
  <polygon points="24,81 60,99 60,111 24,93" fill="#ef4444" />
  <polygon points="96,81 60,99 60,111 96,93" fill="#991b1b" />
</svg>
