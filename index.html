<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adversarial Kill-Chain Counter-Engineering™ — Command Deck</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #020617; 
            --bg-node: rgba(10, 15, 29, 0.95);
            --border-base: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --color-blue: #3b82f6;
            --color-cyan: #0ea5e9;
            --color-purple: #a855f7;
            --color-grey: #64748b;
            --color-green: #10b981;
            --color-teal: #14b8a6;
            --color-red: #f43f5e;
            --color-orange: #f97316;
            --logo-blue: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-page); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-main); line-height: 1.6; padding-bottom: 4rem; }

        /* ================= NAVIGATION ================= */
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-base); z-index: 100;
            padding: 1.2rem 2rem; display: flex; justify-content: center;
        }
        .nav-links { 
            display: flex; gap: 1.2rem; list-style: none; flex-wrap: wrap; 
            justify-content: center; align-items: center; 
        }
        
        .nav-links a { 
            display: inline-block;
            color: var(--color-cyan); 
            border: 1px solid var(--color-cyan);
            background: rgba(14, 165, 233, 0.1); 
            padding: 0.5rem 1.2rem; 
            border-radius: 6px;
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 700; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
        }
        
        .nav-links a:hover, 
        .nav-links a.active-link { 
            background: var(--color-cyan); 
            color: #ffffff; 
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); 
        }

        .bullet-lead {
            color: var(--color-cyan);
            font-weight: 800;
        }

        /* ================= HERO HEADER & TOP ARCHITECTURE BLOCKS ================= */
        .hero { padding: 155px 20px 60px; text-align: center; border-bottom: 1px solid var(--border-base); }
        .hero-title-container { display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        .hero-title { font-family: 'Montserrat', sans-serif; font-size: 3.1rem; font-weight: 900; letter-spacing: 3px; color: var(--text-main); text-transform: uppercase; }

        /* JUMP LINKS BAR (TOP POSITION) */
        .jump-links-container {
            max-width: 1300px;
            margin: 0 auto 3.2rem;
            padding: 1.4rem 2rem;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid var(--border-base);
            border-radius: 10px;
            text-align: center;
        }
        .jump-links-intro {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }
        .jump-links { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 0.9rem; 
        }
        .jump-links a { 
            color: var(--color-cyan); 
            border: 1px solid var(--color-cyan); 
            background: rgba(14, 165, 233, 0.08); 
            padding: 0.65rem 1.3rem; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.88rem; 
            font-weight: 700; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
        }
        .jump-links a:hover { 
            background: var(--color-cyan); 
            color: #ffffff; 
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); 
            transform: translateY(-2px); 
        }

        /* ELEVATED HERO ARCHITECTURAL CONTAINERS */
        .hero-arch-block {
            max-width: 1300px;
            margin: 0 auto 3rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-base);
            border-radius: 12px;
            padding: 3rem 3.2rem;
            text-align: left;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }
        .hero-arch-block.topology-block { border-top: 4px solid var(--color-cyan); padding: 2.8rem 2.5rem; }
        .hero-arch-block.math-block { border-top: 4px solid var(--color-blue); }
        .hero-arch-block.gates-block { border-top: 4px solid var(--color-green); }
        .hero-arch-block.solution-block { border-top: 4px solid var(--color-purple); }
        .hero-arch-block.sequence-block { border-top: 4px solid var(--color-cyan); }

        .hero-block-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.12rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            line-height: 1.55;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.85rem;
        }
        .topology-block .hero-block-tag { color: var(--color-cyan); }
        .math-block .hero-block-tag { color: var(--color-blue); }
        .gates-block .hero-block-tag { color: var(--color-green); }
        .solution-block .hero-block-tag { color: var(--color-purple); }
        .sequence-block .hero-block-tag { color: var(--color-cyan); }

        .hero-block-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.65rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            line-height: 1.4;
            color: var(--text-main);
            text-transform: uppercase;
            margin-bottom: 1.6rem;
            padding-bottom: 0.9rem;
            border-bottom: 2px solid var(--border-base);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.8;
            margin-bottom: 2rem;
            text-align: left;
        }

        /* FULL-WIDTH MASTER MISSION BANNER BOX (PART 01 TOP) */
        .mission-master-banner {
            background: rgba(10, 15, 29, 0.95);
            border: 1px solid var(--border-base);
            border-left: 5px solid var(--color-blue);
            border-radius: 10px;
            padding: 2.2rem 2.4rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .mission-banner-lead {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.22rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.65;
            margin-bottom: 1.25rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--border-base);
        }

        /* 2-COLUMN EXECUTIVE MISSION & PREREQUISITE SPLIT GRID (PART 01 MIDDLE) */
        .mission-split-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.8rem;
            margin-bottom: 2.2rem;
        }
        .mission-split-card {
            background: rgba(10, 15, 29, 0.95);
            border: 1px solid var(--border-base);
            border-left: 4px solid var(--color-purple);
            border-radius: 10px;
            padding: 2.1rem 2.2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
        }
        .mission-split-card.cyan-left {
            border-left-color: var(--color-cyan);
        }
        .mission-split-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.28rem;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-base);
        }
        .mission-bullet-list {
            list-style: disc;
            padding-left: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.95rem;
        }
        .mission-bullet-list li {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.7;
            padding-left: 0.2rem;
        }
        .mission-bullet-list li::marker {
            color: var(--color-cyan);
        }

        /* 4-COLUMN GATE CARDS GRID */
        .gates-4col-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }
        .gate-card {
            background: rgba(10, 15, 29, 0.95);
            border: 1px solid var(--border-base);
            border-top: 4px solid var(--color-green);
            border-radius: 10px;
            padding: 1.8rem 1.6rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
        }
        .gate-card.blue-top { border-top-color: var(--color-blue); }
        .gate-card-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--color-green);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .gate-card.blue-top .gate-card-badge { color: var(--color-blue); }
        .gate-card-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            margin-bottom: 0.85rem;
            padding-bottom: 0.7rem;
            border-bottom: 1px solid var(--border-base);
            line-height: 1.3;
        }
        .gate-card-text {
            font-size: 1.02rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.65;
        }

        /* 2X2 ATTRIBUTES GRID FOR AI SOLUTION */
        .attributes-2x2-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.75rem;
        }
        .attribute-card {
            background: rgba(10, 15, 29, 0.95);
            border: 1px solid var(--border-base);
            border-left: 4px solid var(--color-purple);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }
        .attribute-card-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--color-cyan);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            padding-bottom: 0.65rem;
            border-bottom: 1px solid var(--border-base);
            letter-spacing: 0.5px;
        }
        .attribute-card-text {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.7;
        }

        /* 7 STEPPED PHASE CARDS */
        .phase-cards-stack {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            margin-bottom: 2.2rem;
        }
        .phase-step-card {
            background: rgba(10, 15, 29, 0.95);
            border: 1px solid var(--border-base);
            border-left: 4px solid var(--color-cyan);
            border-radius: 10px;
            padding: 1.85rem 2.2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }
        .phase-step-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.7rem;
            border-bottom: 1px solid var(--border-base);
            flex-wrap: wrap;
        }
        .phase-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 800;
            color: #ffffff;
            background: var(--color-cyan);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .phase-step-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .phase-step-lead {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 0.85rem;
        }
        .phase-subgrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            list-style: none;
            padding: 0;
            margin-top: 0.85rem;
        }
        .phase-subgrid.three-col {
            grid-template-columns: repeat(3, 1fr);
        }
        .phase-subitem {
            background: rgba(2, 6, 23, 0.75);
            border: 1px solid var(--border-base);
            border-top: 2px solid var(--color-cyan);
            border-radius: 6px;
            padding: 1.1rem 1.25rem;
            font-size: 1.02rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.6;
        }

        /* GENERIC SUBLIST FOR OTHER SECTIONS */
        .hero-step-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }
        .hero-step-item {
            font-size: 1.15rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.75;
            padding-left: 1.15rem;
            border-left: 3px solid var(--color-cyan);
        }
        .step-label {
            color: var(--color-cyan);
            font-weight: 800;
        }
        .step-sublist {
            list-style: disc;
            margin-top: 0.65rem;
            padding-left: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .step-sublist li {
            font-size: 1.08rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.65;
            padding-left: 0.25rem;
        }
        .step-sublist li::marker {
            color: var(--color-cyan);
        }

        /* ================= INSIGHT CALLOUT ================= */
        .insight-box { border-left: 4px solid var(--color-purple); padding: 2.2rem 2.5rem; margin: 2.5rem auto 0; max-width: 1300px; border-radius: 0 8px 8px 0; text-align: left; }
        .insight-header { font-family: 'Montserrat', sans-serif; font-size: 1.15rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .insight-header::before { content: '>'; font-weight: 900; }
        .insight-text { font-size: 1.2rem; color: var(--text-main); font-style: normal; line-height: 1.8; font-weight: 600; }

        #system-topology, #scientific-foundation, #foundation-gates, #ai-solution, #execution-sequence, #execution-triad, #execution-flow, #enterprise-guardrails, #environment-agnostic { 
            scroll-margin-top: 100px; 
        }

        /* ================= SECTION 2: EXECUTION TRIAD ================= */
        .module-section { display: flex; flex-direction: column; align-items: center; padding: 5rem 20px 2rem; }
        .architecture-container { width: 100%; max-width: 1300px; display: flex; flex-direction: column; align-items: center; }
        
        .summary-section { max-width: 1220px; text-align: center; margin-bottom: 4.5rem; }
        .summary-title { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1.8rem; color: var(--color-cyan); }
        .summary-text { font-size: 1.25rem; color: var(--text-main); font-weight: 600; line-height: 1.8; margin: 0 auto 2.8rem; max-width: 1050px; text-align: left; }
        
        /* THE TRIAD GRID */
        .triad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; text-align: left; }
        .triad-card { background: rgba(10, 15, 29, 0.95); border: 1px solid var(--border-base); border-top: 4px solid; padding: 2.2rem 2rem; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.45); display: flex; flex-direction: column; }
        .triad-card.architect { border-top-color: var(--color-blue); }
        .triad-card.machine { border-top-color: var(--color-cyan); }
        .triad-card.ai { border-top-color: var(--color-purple); }
        
        .triad-role { font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; font-weight: 800; letter-spacing: 1px; margin-bottom: 0.6rem; text-transform: uppercase; }
        .triad-card.architect .triad-role { color: var(--color-blue); }
        .triad-card.machine .triad-role { color: var(--color-cyan); }
        .triad-card.ai .triad-role { color: var(--color-purple); }

        .triad-header { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--text-main); margin-bottom: 1rem; padding-bottom: 0.85rem; border-bottom: 1px solid var(--border-base); text-transform: uppercase; letter-spacing: 1px; }
        .triad-lead { font-size: 1.08rem; color: var(--text-main); font-weight: 600; line-height: 1.7; margin-bottom: 1.2rem; }
        .triad-sublist {
            list-style: disc;
            padding-left: 1.35rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .triad-sublist li {
            font-size: 1.02rem;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1.65;
            padding-left: 0.2rem;
        }
        .triad-sublist li::marker {
            color: var(--color-cyan);
        }
        
        /* ================= THE GRAPHIC & ARCHITECTURAL FLOW (920PX FULL CLEARANCE, ZERO SCROLLBAR) ================= */
        .flow-title { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; color: var(--color-cyan); margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 1px; text-align: center; width: 100%; }
        
        .canvas-wrapper { width: 100%; overflow: visible; }
        .diagram-canvas {
            position: relative; width: 1180px; max-width: 100%; height: 920px; margin: 0 auto;
            background-color: rgba(2, 6, 23, 0.92);
            background-image: linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
            background-size: 40px 40px; border: 1px solid var(--border-base); border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .routing-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        @keyframes flow { to { stroke-dashoffset: -20; } }
        @keyframes ai-scanlines {
            from { background-position: 0 0; }
            to { background-position: 56px 56px; }
        }
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 15px rgba(14, 165, 233, 0.35), inset 0 0 10px rgba(14, 165, 233, 0.15); }
            50% { box-shadow: 0 0 35px rgba(14, 165, 233, 0.6), inset 0 0 20px rgba(14, 165, 233, 0.3); }
            100% { box-shadow: 0 0 15px rgba(14, 165, 233, 0.35), inset 0 0 10px rgba(14, 165, 233, 0.15); }
        }
        @keyframes pulse-purple {
            0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.35), inset 0 0 10px rgba(168, 85, 247, 0.15); }
            50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), inset 0 0 20px rgba(168, 85, 247, 0.3); }
            100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.35), inset 0 0 10px rgba(168, 85, 247, 0.15); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.35), inset 0 0 10px rgba(244, 63, 94, 0.15); }
            50% { box-shadow: 0 0 35px rgba(244, 63, 94, 0.6), inset 0 0 20px rgba(244, 63, 94, 0.3); }
            100% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.35), inset 0 0 10px rgba(244, 63, 94, 0.15); }
        }
        
        .animated-path { stroke-dasharray: 8, 12; animation: flow 1s linear infinite; }

        .node { position: absolute; background: var(--bg-node); border: 1px solid var(--border-base); border-radius: 8px; padding: 1.05rem; z-index: 2; backdrop-filter: blur(8px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .node-title { font-size: 0.92rem; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 0.55rem; line-height: 1.25; color: var(--text-main); }
        .node-text { font-size: 0.8rem; color: var(--text-main); font-weight: 500; line-height: 1.48; }
        .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; font-weight: 800; padding: 3px 6px; border: 1px solid; border-radius: 4px; display: inline-block; margin-bottom: 0.55rem; letter-spacing: 0.5px; }

        /* TOP ROW NODES (y = 25px) */
        .node-engineer { left: 15px; top: 25px; width: 205px; border-left: 4px solid var(--color-blue); }
        .node-engineer .tag { color: var(--color-blue); border-color: rgba(59, 130, 246, 0.3); }
        
        .node-compiler { 
            left: 245px; top: 25px; width: 225px; 
            border: 2px solid var(--color-purple); border-left: 6px solid var(--color-purple); 
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(168, 85, 247, 0.15) 4px, rgba(168, 85, 247, 0.15) 8px), linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(10, 15, 29, 0.95) 100%), var(--bg-node);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), inset 0 0 15px rgba(168, 85, 247, 0.15);
            animation: ai-scanlines 1.5s linear infinite, pulse-purple 3s ease-in-out infinite;
        }
        .node-compiler .tag { color: var(--color-purple); border-color: rgba(168, 85, 247, 0.3); }
