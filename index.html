<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Architecture - Home</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-80NYKHYN3R"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #020617; 
            --bg-node: rgba(10, 15, 29, 0.95);
            --border-base: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --color-blue: #3b82f6;
            --color-cyan: #0ea5e9;
            --color-purple: #a855f7;
            --color-grey: #64748b;
            --color-green: #10b981;
            --color-teal: #14b8a6;
            --color-red: #f43f5e;
            --color-orange: #f97316;
            --logo-blue: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-page); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-main); line-height: 1.6; }

        /* ================= NAVIGATION ================= */
        nav {
            position: fixed; top: 0; width: 100%;
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-base); z-index: 100;
            padding: 1.2rem 2rem; display: flex; justify-content: center;
        }
        .nav-links { 
            display: flex; gap: 1.2rem; list-style: none; flex-wrap: wrap; 
            justify-content: center; align-items: center; 
        }
        
        /* Universal Button Styling for all links */
        .nav-links a { 
            display: inline-block;
            color: var(--color-cyan); 
            border: 1px solid var(--color-cyan);
            background: rgba(14, 165, 233, 0.1); 
            padding: 0.5rem 1.2rem; 
            border-radius: 6px;
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 700; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
        }
        
        /* Hover state and Active Page state are filled solid */
        .nav-links a:hover, 
        .nav-links a.active-link { 
            background: var(--color-cyan); 
            color: #ffffff; 
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); 
        }

        /* ================= HERO HEADER ================= */
        .hero { padding: 180px 20px 80px; text-align: center; border-bottom: 1px solid var(--border-base); }
        .hero-title-container { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .hero-title { font-family: 'Montserrat', sans-serif; font-size: 4rem; font-weight: 900; letter-spacing: 3px; color: var(--text-main); text-transform: uppercase; }
        .hero-subtitle { font-size: 1.45rem; color: var(--color-cyan); font-weight: 500; max-width: 1100px; margin: 0 auto; line-height: 1.6; }
        .nowrap { white-space: nowrap; }

        /* ================= JUMP LINKS ================= */
        .jump-links { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 1rem; 
            margin-top: 2.5rem; 
        }
        .jump-links a { 
            color: var(--color-cyan); 
            border: 1px solid var(--color-cyan); 
            background: rgba(14, 165, 233, 0.05); 
            padding: 0.75rem 1.5rem; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.95rem; 
            font-weight: 700; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
        }
        .jump-links a:hover { 
            background: var(--color-cyan); 
            color: #ffffff; 
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); 
            transform: translateY(-2px); 
        }

        /* Offset for fixed navigation on anchor jumps */
        #execution-triad, #execution-flow, #enterprise-guardrails, #environment-agnostic { 
            scroll-margin-top: 100px; 
        }

        /* ================= INSIGHT CALLOUT ================= */
        .insight-box { border-left: 4px solid var(--color-purple); padding: 2rem; margin: 3rem auto 2.5rem; max-width: 1050px; border-radius: 0 8px 8px 0; text-align: left; }
        .insight-header { font-family: 'Montserrat', sans-serif; font-size: 1.15rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
        .insight-header::before { content: '>'; font-weight: 900; }
        .insight-text { font-size: 1.15rem; color: var(--text-main); font-style: italic; line-height: 1.7; font-weight: 500; }

        /* Hero Insight Modifier */
        .hero-insight { background: rgba(14, 165, 233, 0.05); border-left-color: var(--color-cyan); margin-top: 2.5rem; padding: 1.5rem 2.5rem; }
        .hero-insight .insight-header { color: var(--color-cyan); }
        .hero-insight .insight-text { color: var(--text-muted); font-size: 1.1rem; }

        /* ================= ENVIRONMENT & PROXY ================= */
        .module-section { display: flex; flex-direction: column; align-items: center; padding: 5rem 20px 2rem; }
        .architecture-container { width: 100%; max-width: 1300px; display: flex; flex-direction: column; align-items: center; }
        
        .summary-section { max-width: 1100px; text-align: center; margin-bottom: 4rem; }
        .summary-title { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1.8rem; color: var(--logo-blue); }
        .summary-text { font-size: 1.2rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 3rem; text-align: center; }
        
        /* THE TRIAD GRID */
        .triad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; text-align: left; }
        .triad-card { background: rgba(15, 23, 42, 0.6); border-top: 4px solid; padding: 2rem; border-radius: 8px; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3); }
        .triad-card.architect { border-color: var(--color-blue); }
        .triad-card.machine { border-color: var(--color-cyan); }
        .triad-card.ai { border-color: var(--color-purple); }
        
        .triad-header { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .triad-role { font-size: 0.85rem; font-family: monospace; letter-spacing: 1px; margin-bottom: 0.5rem; text-transform: uppercase; }
        .triad-card.architect .triad-role { color: var(--color-blue); }
        .triad-card.machine .triad-role { color: var(--color-cyan); }
        .triad-card.ai .triad-role { color: var(--color-purple); }
        .triad-text { font-size: 1.05rem; color: var(--text-muted); line-height: 1.7; }
        
        /* THE GRAPHIC & FLOW */
        .flow-title { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; color: var(--logo-blue); margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 1px; text-align: center; width: 100%; }
        
        .canvas-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 15px; }
        .diagram-canvas {
            position: relative; max-width: 1220px; min-width: 1220px; height: 680px; margin: 0 auto;
            background-image: linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
            background-size: 40px 40px; border: 1px solid var(--border-base); border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .routing-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* CSS ANIMATIONS FOR GRAPHIC */
        @keyframes flow { to { stroke-dashoffset: -20; } }
        @keyframes ai-scanlines {
            from { background-position: 0 0; }
            to { background-position: 56px 56px; }
        }
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 15px rgba(14, 165, 233, 0.35), inset 0 0 10px rgba(14, 165, 233, 0.15); }
            50% { box-shadow: 0 0 35px rgba(14, 165, 233, 0.6), inset 0 0 20px rgba(14, 165, 233, 0.3); }
            100% { box-shadow: 0 0 15px rgba(14, 165, 233, 0.35), inset 0 0 10px rgba(14, 165, 233, 0.15); }
        }
        @keyframes pulse-purple {
            0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.35), inset 0 0 10px rgba(168, 85, 247, 0.15); }
            50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), inset 0 0 20px rgba(168, 85, 247, 0.3); }
            100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.35), inset 0 0 10px rgba(168, 85, 247, 0.15); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.35), inset 0 0 10px rgba(244, 63, 94, 0.15); }
            50% { box-shadow: 0 0 35px rgba(244, 63, 94, 0.6), inset 0 0 20px rgba(244, 63, 94, 0.3); }
            100% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.35), inset 0 0 10px rgba(244, 63, 94, 0.15); }
        }
        
        .animated-path { stroke-dasharray: 8, 12; animation: flow 1s linear infinite; }

        .node { position: absolute; background: var(--bg-node); border: 1px solid var(--border-base); border-radius: 8px; padding: 1.1rem; z-index: 2; backdrop-filter: blur(8px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .node-title { font-size: 1rem; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 0.75rem; line-height: 1.2; }
        .node-text { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
        .tag { font-family: monospace; font-size: 0.7rem; font-weight: 700; padding: 3px 6px; border: 1px solid; border-radius: 4px; display: inline-block; margin-bottom: 0.75rem; letter-spacing: 0.5px; }

        /* Compressed 1200px Grid Coordinates */
        .node-engineer { left: 20px; top: 40px; width: 200px; border-left: 4px solid var(--color-blue); }
        .node-engineer .tag { color: var(--color-blue); border-color: rgba(59, 130, 246, 0.3); }
        .node-engineer .highlight { color: var(--color-purple); font-weight: 600; margin-top: 8px; display: block; }
        
        .node-compiler { 
            left: 250px; top: 40px; width: 220px; 
            border: 2px solid var(--color-purple); border-left: 6px solid var(--color-purple); 
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(168, 85, 247, 0.15) 4px, rgba(168, 85, 247, 0.15) 8px), linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(10, 15, 29, 0.95) 100%), var(--bg-node);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), inset 0 0 15px rgba(168, 85, 247, 0.15);
            animation: ai-scanlines 1.5s linear infinite, pulse-purple 3s ease-in-out infinite;
        }
        .node-compiler .tag { color: var(--color-purple); border-color: rgba(168, 85, 247, 0.3); }

        .node-iac { left: 500px; top: 40px; width: 180px; border-left: 4px solid var(--color-cyan); }
        .node-iac .tag { color: var(--color-cyan); border-color: rgba(14, 165, 233, 0.3); }
        
        .node-core { left: 710px; top: 40px; width: 220px; border: 1px solid rgba(16, 185, 129, 0.3); border-left: 4px solid var(--color-green); }
        .node-core .tag { color: var(--color-green); border-color: rgba(16, 185, 129, 0.3); }
        .node-core .highlight { color: var(--color-green); font-weight: 600; margin-top: 8px; display: block; }

        .node-scale { left: 960px; top: 40px; width: 220px; border: 1px dashed var(--color-purple); border-left: 4px solid var(--color-purple); }
        .node-scale .tag { color: var(--color-purple); border-color: rgba(168, 85, 247, 0.3); }
        .node-scale .highlight { color: var(--color-purple); font-weight: 600; margin-top: 8px; display: block; }
        
        .node-engine { 
            left: 20px; top: 300px; width: 200px; 
            border: 2px solid var(--color-cyan); border-left: 6px solid var(--color-cyan); 
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(14, 165, 233, 0.18) 4px, rgba(14, 165, 233, 0.18) 8px), linear-gradient(135deg, rgba(14, 165, 233, 0.25) 0%, rgba(10, 15, 29, 0.95) 100%), var(--bg-node); 
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.45), inset 0 0 15px rgba(14, 165, 233, 0.25); 
            animation: ai-scanlines 2s linear infinite, pulse-cyan 3.5s ease-in-out infinite;
        }
        .node-engine .tag { color: var(--color-cyan); border-color: rgba(14, 165, 233, 0.3); margin-right: 5px; }

        .node-dpl { 
            left: 250px; top: 420px; width: 380px; 
            border: 2px solid var(--color-red); border-left: 6px solid var(--color-red); 
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(244, 63, 94, 0.15) 4px, rgba(244, 63, 94, 0.15) 8px), linear-gradient(135deg, rgba(244, 63, 94, 0.15) 0%, rgba(10, 15, 29, 0.95) 100%), var(--bg-node); 
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.35), inset 0 0 15px rgba(244, 63, 94, 0.15); 
            animation: ai-scanlines 2.5s linear infinite, pulse-red 4s ease-in-out infinite;
        }
        .node-dpl .tag { color: var(--color-red); border-color: rgba(244, 63, 94, 0.3); }

        .node-ial { left: 670px; top: 420px; width: 200px; border-left: 4px solid var(--color-green); }
        .node-ial .tag { color: var(--color-green); border-color: rgba(16, 185, 129, 0.3); }
        
        .node-arl { left: 900px; top: 420px; width: 230px; border-left: 4px solid var(--color-green); }
        .node-arl .tag { color: var(--color-green); border-color: rgba(16, 185, 129, 0.3); }

        /* ================= ARCHITECTURAL FLOW EXPLANATION ================= */
        .flow-explanation { max-width: 1050px; margin: 2.5rem auto 0; padding: 0 20px; text-align: left; }
        .flow-subheader { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin-bottom: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .flow-text { font-size: 1.15rem; color: var(--text-main); font-weight: 600; line-height: 1.8; margin-bottom: 1.5rem; }
        
        .inline-link { color: var(--color-cyan); text-decoration: none; border-bottom: 1px solid var(--color-cyan); transition: color 0.3s ease, border-color 0.3s ease; }
        .inline-link:hover { color: #ffffff; border-color: #ffffff; }

        /* ================= ENTERPRISE GUARDRAILS ================= */
        .guardrail-container { max-width: 1300px; margin: 0 auto; padding: 4rem 20px 3rem; }
        
        .prelude-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-base); border-top: 4px solid var(--color-blue); border-radius: 12px; padding: 3.5rem; box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .section-title { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 2rem; letter-spacing: 1px; text-align: center; }
        
        .intro-text { font-size: 1.25rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 3.5rem; text-align: center; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .intro-text strong { color: var(--color-cyan); font-weight: 700; }

        .vulnerability-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; }
        .vuln-card { background: rgba(2, 6, 23, 0.9); border: 1px solid var(--border-base); padding: 2.2rem; border-radius: 10px; border-left: 4px solid var(--color-purple); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .vuln-title { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 1rem; letter-spacing: 0.5px; }
        .vuln-text { font-size: 1.15rem; color: var(--text-muted); line-height: 1.7; }
        .vuln-highlight { color: var(--color-cyan); font-weight: 600; }

        .vuln-card:nth-child(5) { grid-column: 1 / -1; }

        /* ================= MODULE 3: POLYMORPHIC COMBINATORIAL MATRIX ================= */
        .polymorphic-container { max-width: 1300px; margin: 0 auto; padding: 2rem 20px 8rem; }
        
        .polymorphic-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-base);
            border-top: 4px solid var(--color-cyan);
            border-radius: 12px;
            padding: 4rem 3.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .poly-tag {
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            text-align: center;
            margin-bottom: 0.75rem;
        }

        /* 5-Column Graphic Canvas */
        .matrix-graphic-canvas {
            background-image: linear-gradient(to right, rgba(30, 41, 59, 0.45) 1px, transparent 1px), linear-gradient(to bottom, rgba(30, 41, 59, 0.45) 1px, transparent 1px);
            background-size: 32px 32px;
            background-color: rgba(2, 6, 23, 0.9);
            border: 1px solid var(--border-base);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            margin-bottom: 3.5rem;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 15px 30px rgba(0,0,0,0.4);
        }

        .matrix-5col-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.25rem;
        }

        .matrix-node {
            background: var(--bg-node);
            border: 1px solid rgba(14, 165, 233, 0.35);
            border-top: 3px solid var(--color-cyan);
            border-radius: 8px;
            padding: 1.5rem 1.25rem;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.1);
            display: flex;
            flex-direction: column;
        }

        .matrix-node-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--text-main);
            text-transform: uppercase;
            padding-bottom: 0.85rem;
            margin-bottom: 1.1rem;
            border-bottom: 1px solid var(--border-base);
        }

        .matrix-option {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            font-size: 0.92rem;
            color: var(--text-main);
            margin-bottom: 0.85rem;
            line-height: 1.35;
            font-weight: 500;
        }
        .matrix-option:last-child { margin-bottom: 0; }

        .matrix-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border: 1px solid var(--color-cyan);
            background: rgba(14, 165, 233, 0.08);
            border-radius: 3px;
            font-size: 11px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Combinatorial Telemetry Readout Bar */
        .combinatorial-bar {
            margin-top: 2rem;
            padding: 1.5rem 2rem;
            border-radius: 8px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-left: 5px solid var(--color-purple);
            background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(168, 85, 247, 0.08) 4px, rgba(168, 85, 247, 0.08) 8px), rgba(10, 15, 29, 0.95);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }

        .combo-formula {
            font-family: monospace;
            font-size: 0.98rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .combo-formula span { color: var(--color-cyan); }

        .combo-result {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-green);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 0.5
