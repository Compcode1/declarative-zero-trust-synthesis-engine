cat << 'EOF' > favicon.svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Obsidian Armor Base & Slate Bezel -->
  <rect width="114" height="114" x="3" y="3" fill="#090d16" rx="22" stroke="#1e293b" stroke-width="3" />
  
  <!-- Gate 1: Gunmetal Bevel (Boundary) -->
  <polygon points="24,18 60,36 60,48 24,30" fill="#64748b" />
  <polygon points="96,18 60,36 60,48 96,30" fill="#334155" />

  <!-- Gate 2: Deep Navy-Cobalt Bevel (Identity - Darker & Heavier) -->
  <polygon points="24,39 60,57 60,69 24,51" fill="#1e40af" />
  <polygon points="96,39 60,57 60,69 96,51" fill="#172554" />

  <!-- Gate 3: Bright Tactical Cobalt Bevel (Federation - Clear Step Lighter) -->
  <polygon points="24,60 60,78 60,90 24,72" fill="#3b82f6" />
  <polygon points="96,60 60,78 60,90 96,72" fill="#1d4ed8" />

  <!-- Gate 4: Adversarial Crimson Bevel (Access Lockdown) -->
  <polygon points="24,81 60,99 60,111 24,93" fill="#dc2626" />
  <polygon points="96,81 60,99 60,111 96,93" fill="#991b1b" />
</svg>
EOF

git add favicon.svg
git commit -m "Update favicon.svg to unified Tactical Cobalt and Adversarial Crimson 4-Gate bevel"
git push origin main
